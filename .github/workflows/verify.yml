name: Plugin Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # GitHub-hosted runner on purpose: public repo + fork PRs must never reach a self-hosted machine.
    uses: JirakJ/intellij-plugin-verifier/.github/workflows/verify-plugin.yml@ci/harden-verify
    with:
      gradle-plugin-version: "2.x"
      runner-label: "ubuntu-latest"
      java-version: "17"
      detekt: true
